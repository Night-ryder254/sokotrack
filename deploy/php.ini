; --- security -------------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; PHP2Shell follow-up, CVE-2026-115560: PHP has not shipped a fix yet, so the feature
; is switched off. Laravel does not use session upload progress.
session.upload_progress.enabled = 0

; --- limits ---------------------------------------------------------------------
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 60

; --- OPcache: the image never changes after the build, so never re-check files -----
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; --- misc -----------------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.assertions = -1
