[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/opt/deploy/start-clean.sh php-fpm php-fpm -F
priority=10
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/opt/deploy/start-clean.sh nginx nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs the Laravel scheduler: the daily low-stock digest and the release of unanswered
; M-Pesa payments. Safe because the web service runs a single instance.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
priority=30
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
